<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f0f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#dc2626" />

  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="120" fill="#dc2626" opacity="0.1" />
  <circle cx="100" cy="550" r="100" fill="#dc2626" opacity="0.08" />

  <!-- Logo placeholder (brand colors) -->
  <g transform="translate(80, 80)">
    <circle cx="100" cy="100" r="100" fill="none" stroke="#dc2626" stroke-width="4" />
    <path d="M 100 50 Q 140 100 100 150 Q 60 100 100 50" fill="#dc2626" opacity="0.9" />
    <circle cx="100" cy="100" r="15" fill="#dc2626" />
  </g>

  <!-- Main heading -->
  <text x="320" y="140" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="80" font-weight="bold" fill="#ffffff" letter-spacing="-2">
    Western
  </text>
  <text x="320" y="220" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="80" font-weight="bold" fill="#ffffff" letter-spacing="-2">
    Wheelcraft
  </text>

  <!-- Accent divider -->
  <line x1="320" y1="250" x2="1100" y2="250" stroke="#dc2626" stroke-width="3" />

  <!-- Subheading -->
  <text x="320" y="320" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="42" fill="#cccccc" letter-spacing="-0.5">
    BC's Wheel Refinishing Experts
  </text>

  <!-- Features -->
  <text x="320" y="400" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="32" fill="#999999">
    ✓ Premium Finishing   ✓ Fast Turnaround   ✓ Guaranteed Quality
  </text>

  <!-- CTA -->
  <text x="320" y="520" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="28" fill="#dc2626" font-weight="600">
    westernwheelcraft.ca
  </text>
</svg>