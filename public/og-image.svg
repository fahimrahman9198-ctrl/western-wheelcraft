<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f4ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede8df;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c41e1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a91414;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Decorative accent -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent-grad)" />
  <circle cx="1150" cy="150" r="180" fill="#c41e1e" opacity="0.05" />
  <circle cx="50" cy="500" r="160" fill="#c41e1e" opacity="0.04" />

  <!-- Logo circle design (wheel inspired) -->
  <g transform="translate(80, 140)">
    <circle cx="80" cy="80" r="75" fill="none" stroke="#1a1714" stroke-width="3" opacity="0.2" />
    <circle cx="80" cy="80" r="60" fill="none" stroke="#1a1714" stroke-width="2" opacity="0.3" />
    <circle cx="80" cy="80" r="45" fill="none" stroke="#c41e1e" stroke-width="3" />
    <circle cx="80" cy="80" r="12" fill="#c41e1e" />
    <!-- Spokes -->
    <line x1="80" y1="35" x2="80" y2="125" stroke="#c41e1e" stroke-width="2" opacity="0.6" />
    <line x1="35" y1="80" x2="125" y2="80" stroke="#c41e1e" stroke-width="2" opacity="0.6" />
    <line x1="50" y1="50" x2="110" y2="110" stroke="#c41e1e" stroke-width="2" opacity="0.4" />
    <line x1="110" y1="50" x2="50" y2="110" stroke="#c41e1e" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Main text -->
  <text x="320" y="140" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="bold" fill="#1a1714" letter-spacing="-3">
    Western
  </text>
  <text x="320" y="230" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="bold" fill="#c41e1e" letter-spacing="-3">
    Wheelcraft
  </text>

  <!-- Tagline -->
  <text x="320" y="310" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#1a1714" font-weight="500">
    Premium Wheel Refinishing
  </text>

  <!-- Description -->
  <text x="320" y="375" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#666666">
    BC's Trusted Refinishing Experts
  </text>

  <!-- Features -->
  <text x="320" y="450" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#888888">
    ✓ OEM Color Matching  ✓ Curb Rash Repair  ✓ Custom Finishes
  </text>

  <!-- CTA Button -->
  <rect x="300" y="500" width="600" height="80" fill="#c41e1e" rx="12" />
  <text x="600" y="560" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">
    westernwheelcraft.ca
  </text>
</svg>